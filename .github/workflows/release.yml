name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version / tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      create_release:
        description: 'Publish as a GitHub Release (attaches APK)'
        required: true
        type: boolean
        default: true
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Configure Environment Files
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          fi
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          fi

      - name: Setup Keystore & Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using custom release keystore from repository secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=${SECRET_KEY_ALIAS:-upload}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "No custom keystore found in secrets. Generating CI release keystore for installable APK..."
            keytool -genkeypair -v \
              -keystore release.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass dualcam123 \
              -keypass dualcam123 \
              -dname "CN=DualCam, OU=Android, O=ZeroKid, L=Unknown, ST=Unknown, C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=dualcam123" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
            echo "KEY_PASSWORD=dualcam123" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        id: prepare
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="snapshot-${GITHUB_SHA::7}"
          fi
          
          # Find generated release APK
          SRC_APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "Error: No release APK found in app/build/outputs/apk/release/"
            exit 1
          fi
          
          OUTPUT_APK="DualCam-${VERSION}.apk"
          OUTPUT_SHA="DualCam-${VERSION}.apk.sha256"
          
          cp "$SRC_APK" "$OUTPUT_APK"
          sha256sum "$OUTPUT_APK" > "$OUTPUT_SHA"
          
          echo "Built APK: $OUTPUT_APK"
          cat "$OUTPUT_SHA"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "checksum_path=$OUTPUT_SHA" >> $GITHUB_OUTPUT

      - name: Upload Artifact to Run
        uses: actions/upload-artifact@v4
        with:
          name: DualCam-${{ steps.prepare.outputs.version }}-apk
          path: |
            ${{ steps.prepare.outputs.apk_path }}
            ${{ steps.prepare.outputs.checksum_path }}
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        with:
          tag_name: ${{ steps.prepare.outputs.version }}
          name: DualCam ${{ steps.prepare.outputs.version }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            ${{ steps.prepare.outputs.apk_path }}
            ${{ steps.prepare.outputs.checksum_path }}
